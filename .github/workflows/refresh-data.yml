name: Refresh report data

# Unattended cloud refresh.
#
# Requires app-only auth: Microsoft Graph *Application* permission Sites.Selected,
# admin consented, plus a per-site grant on the site collection holding the
# sources. This runs as the "YMS - Sharepoint API" registration, which already
# carries both for /sites/ProcessOptimizationandDevelopment.
#
# Verify readiness at any time with:  python tools/check_app_auth.py
#
# If auth lapses (an expired client secret being the likely cause) every source
# returns 401, the build is flagged degraded and NOTHING is published - the
# report keeps serving the last good snapshot rather than a page of zeroes.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this manual refresh was triggered"
        required: false
        default: "Manual refresh"
  schedule:
    - cron: "*/15 * * * *"

env:
  SAFRIPOL_AUTH_MODE: app

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build snapshot
        id: build
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          set +e
          python -m ingest
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 0 = clean, 2 = built but a required source was unreachable.
          # Anything else is a genuine failure.
          if [ $code -ne 0 ] && [ $code -ne 2 ]; then exit $code; fi

      - name: Commit snapshot
        # A degraded build means a required source was unreachable, so the
        # snapshot is missing real figures. Publishing it would blank a working
        # report over a transient SharePoint or Graph outage. Keep the last good
        # one instead - a stale timestamp is far better than a page of zeroes.
        if: steps.build.outputs.exit_code == '0'
        run: |
          git config user.name  "safripol-report-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/snapshot.json docs/data/version.json
          if git diff --cached --quiet; then
            echo "No data change."
          else
            git commit -m "data: refresh snapshot $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Flag degraded refresh
        if: steps.build.outputs.exit_code == '2'
        run: |
          echo "::warning::A required source could not be read, so the snapshot" \
               "was NOT published. The report is still serving the last good" \
               "data. Check credentials and the Data Sources tab."
