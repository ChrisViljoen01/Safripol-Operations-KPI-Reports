name: Refresh report data

# NOTE: currently inactive on a schedule.
#
# Refreshing from CI needs app-only auth, which requires an *Application*
# permission grant (Files.Read.All) on the "Connect Logistics AI Hub" app
# registration. Only *Delegated* permissions were approved, and a delegated
# token is tied to a signed-in user, so it cannot be issued on a runner.
#
# Until that grant changes, the refresh runs on an operator machine via
# tools/install_task.ps1 (Windows Scheduled Task) which does the same work and
# pushes the snapshot here.
#
# If Application permission is granted later, delete the workflow_dispatch-only
# restriction below and restore the schedule to make this the primary path.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this manual refresh was triggered"
        required: false
        default: "Manual refresh"
  # schedule:
  #   - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build snapshot
        id: build
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          set +e
          python -m ingest
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 0 = clean, 2 = built but a required source was unreachable.
          # Anything else is a genuine failure.
          if [ $code -ne 0 ] && [ $code -ne 2 ]; then exit $code; fi

      - name: Commit snapshot
        # A degraded build means a required source was unreachable, so the
        # snapshot is missing real figures. Publishing it would blank a working
        # report over a transient SharePoint or Graph outage. Keep the last good
        # one instead - a stale timestamp is far better than a page of zeroes.
        if: steps.build.outputs.exit_code == '0'
        run: |
          git config user.name  "safripol-report-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/snapshot.json docs/data/version.json
          if git diff --cached --quiet; then
            echo "No data change."
          else
            git commit -m "data: refresh snapshot $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Flag degraded refresh
        if: steps.build.outputs.exit_code == '2'
        run: |
          echo "::warning::A required source could not be read, so the snapshot" \
               "was NOT published. The report is still serving the last good" \
               "data. Check credentials and the Data Sources tab."
