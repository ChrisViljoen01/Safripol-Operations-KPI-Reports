services:
  report:
    build: .
    image: safripol-ops-report
    container_name: safripol-ops-report
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
      REFRESH_SECONDS: "900"
      PORT: "8080"
    volumes:
      # keeps the last good snapshot across container restarts
      - report-data:/app/docs/data

volumes:
  report-data:
